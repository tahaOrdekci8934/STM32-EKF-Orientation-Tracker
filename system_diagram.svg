<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">
    System Architecture
  </text>
  
  <!-- MPU6050 Block -->
  <rect x="50" y="80" width="150" height="240" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="125" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565c0">
    MPU6050
  </text>
  <text x="125" y="135" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#424242">
    IMU Sensor
  </text>
  
  <!-- MPU6050 Components -->
  <rect x="70" y="160" width="110" height="40" rx="4" fill="#fff" stroke="#1976d2" stroke-width="1"/>
  <text x="125" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#212529">
    Accelerometer
  </text>
  
  <rect x="70" y="210" width="110" height="40" rx="4" fill="#fff" stroke="#1976d2" stroke-width="1"/>
  <text x="125" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#212529">
    Gyroscope
  </text>
  
  <text x="125" y="280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
    ±2g / ±250°/s
  </text>
  
  <!-- I2C Connection -->
  <line x1="200" y1="200" x2="280" y2="200" stroke="#455a64" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="240" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#455a64">
    I2C (100kHz)
  </text>
  
  <!-- STM32 Block -->
  <rect x="280" y="80" width="240" height="240" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    STM32F103RB
  </text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#424242">
    Cortex-M3 @ 72MHz
  </text>
  
  <!-- STM32 Components -->
  <rect x="300" y="150" width="200" height="35" rx="4" fill="#fff" stroke="#388e3c" stroke-width="1"/>
  <text x="400" y="172" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#212529">
    EKF Prediction (Gyro)
  </text>
  
  <rect x="300" y="195" width="200" height="35" rx="4" fill="#fff" stroke="#388e3c" stroke-width="1"/>
  <text x="400" y="217" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#212529">
    EKF Update (Accel)
  </text>
  
  <rect x="300" y="240" width="200" height="35" rx="4" fill="#fff" stroke="#388e3c" stroke-width="1"/>
  <text x="400" y="262" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#212529">
    Quaternion Estimation
  </text>
  
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
    TIM2 @ 20Hz
  </text>
  
  <!-- UART/DMA Connection -->
  <line x1="520" y1="200" x2="600" y2="200" stroke="#455a64" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="560" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#455a64">
    UART + DMA
  </text>
  <text x="560" y="220" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    115200 baud
  </text>
  
  <!-- MATLAB Block -->
  <rect x="600" y="80" width="150" height="240" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="675" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
    MATLAB
  </text>
  <text x="675" y="135" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#424242">
    Visualization
  </text>
  
  <!-- MATLAB Components -->
  <rect x="620" y="160" width="110" height="40" rx="4" fill="#fff" stroke="#f57c00" stroke-width="1"/>
  <text x="675" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#212529">
    Serial Parser
  </text>
  
  <rect x="620" y="210" width="110" height="40" rx="4" fill="#fff" stroke="#f57c00" stroke-width="1"/>
  <text x="675" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#212529">
    3D Renderer
  </text>
  
  <text x="675" y="280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
    Real-time Display
  </text>
  
  <!-- Data Flow Labels -->
  <text x="400" y="360" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#616161">
    20Hz Update Rate • 2.4% CPU Utilization • 32-byte Telemetry Packets
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#455a64"/>
    </marker>
  </defs>
</svg>